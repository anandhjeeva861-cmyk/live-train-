name: Publish Live Train Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/stage-pages.js
        env:
          RAILGO_BACKEND_URL: ${{ vars.RAILGO_BACKEND_URL || 'https://live-train-five.vercel.app' }}
          RAILGO_REQUIRE_EMAIL_LOGIN: "true"
          RAILGO_FRONTEND_ORIGINS: ${{ vars.RAILGO_FRONTEND_ORIGINS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v4
        id: deployment
