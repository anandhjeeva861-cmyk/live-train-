# Optional deployment blueprint. Creating this service requires a paid disk plan.
# Nothing is provisioned simply by pushing this file to GitHub.
services:
  - type: web
    name: live-train-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && DATABASE_URL=file:./prisma/build.db npx prisma generate
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm start
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: live-train-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/railgo.db
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SAME_SITE
        value: none
      - key: ALLOWED_ORIGINS
        value: https://live-train-five.vercel.app,https://anandhjeeva861-cmyk.github.io,http://localhost:4174,http://127.0.0.1:4174
      - key: SESSION_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
