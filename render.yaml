# Optional deployment blueprint. Creating this service requires a paid disk plan.
# Nothing is provisioned simply by pushing this file to GitHub.
services:
  - type: web
    name: railgo
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && DATABASE_URL=file:./prisma/build.db npx prisma generate
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm start
    healthCheckPath: /api/health
    disk:
      name: railgo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/railgo.db
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
